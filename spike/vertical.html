<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>縦書き編集スパイク</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 16px; }
      .row { display: flex; gap: 16px; align-items: flex-start; }
      .box { flex: 1; }
      h2 { font-size: 14px; font-weight: 500; }
      textarea.v, div.v {
        writing-mode: vertical-rl;
        height: 70vh;
        width: 100%;
        font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
        font-size: 16px;
        line-height: 2;
        letter-spacing: 0.05em;
        box-sizing: border-box;
        border: 1px solid #ccc;
        padding: 12px;
        overflow-x: auto;
      }
      div.v { white-space: pre-wrap; outline: none; }
      #log { font-size: 12px; color: #555; }
    </style>
  </head>
  <body>
    <button id="fill">3000字を流し込む</button>
    <span id="log"></span>
    <div class="row">
      <div class="box"><h2>textarea</h2><textarea class="v" id="ta"></textarea></div>
      <div class="box"><h2>contenteditable</h2><div class="v" id="ce" contenteditable="true"></div></div>
    </div>
    <script type="module">
      const sample = '改札を抜けると、雨の匂いがした。傘を持たない人々が軒下に固まって、一様に空を見上げている。彼女はその中にいなかった。\n';
      document.querySelector('#fill').addEventListener('click', () => {
        const text = sample.repeat(Math.ceil(3000 / sample.length));
        document.querySelector('#ta').value = text;
        document.querySelector('#ce').textContent = text;
        document.querySelector('#log').textContent = `${text.length}字`;
      });
    </script>
  </body>
</html>
